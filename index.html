<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>NaViGuide</title>
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="icon" href="icons/naviguide-icon-192.png" type="image/png" />
		<link rel="apple-touch-icon" href="icons/naviguide-icon-180.png" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<section id="intro" class="intro">
			<img
				class="intro-logo"
				src="icons/naviguide-icon-512.png"
				alt=""
				aria-hidden="true"
			/>
			<div id="screen" class="intro-welcome" hidden>
				<h1 id="screen-title"></h1>
				<p id="screen-text"></p>
			</div>
			<button id="begin" class="intro-begin" type="button">
				Tap to continue
			</button>
		</section>
		<main inert>
			<div class="stage">
				<video
					id="camera"
					playsinline
					muted
					autoplay
					aria-hidden="true"
				></video>
				<canvas id="overlay" aria-hidden="true"></canvas>
			</div>
			<p id="status">
				Instructions may lag by a few seconds. Say "Navi, start navigation" or
				press Start to begin.
			</p>
			<button id="toggle" type="button">Start</button>
		</main>
		<script>
			window.onerror = (msg) => {
				document.getElementById("status").textContent = "Error: " + msg;
			};
			window.addEventListener("unhandledrejection", (e) => {
				document.getElementById("status").textContent = "Error: " + e.reason;
			});
			if ("serviceWorker" in navigator) {
				window.addEventListener("load", () => {
					navigator.serviceWorker.register("./sw.js").catch((err) => {
						console.warn("Offline support unavailable:", err);
					});
				});
			}
		</script>
		<!-- ONNX Runtime is vendored locally so the app works offline. -->
		<script src="js/vendor/ort/ort.webgpu.min.js"></script>
		<script type="module" src="js/main.js"></script>
	</body>
</html>
